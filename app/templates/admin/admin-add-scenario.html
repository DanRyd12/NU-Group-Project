{% extends "template.html" %}

{% block title %}Admin · NU Group Project{% endblock %}

{% block content %}
  <nav class="navbar navbar-expand-lg app-navbar admin">
    <div class="container-fluid">
      <a class="navbar-brand" href="index.html">AI Awareness</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#adminNav" aria-controls="adminNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="adminNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="admin-scenarios.html">Scenarios</a></li>
          <li class="nav-item"><a class="nav-link" href="admin-login.html">Log Out</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="container py-5">
    <div class="w-content-lg mx-auto">
      <header class="mt-lg-3 mb-4">
        <h1 class="page-title mb-4">Add New Scenario</h1>
        <p class="fs-18 text-secondary-ink mb-0">Create a scenario with three answer options and assign a score to each.</p>
      </header>

      <!-- Front-end only: point the action at your back end. -->
      <form class="panel p-3 p-md-4" action="admin-scenarios.html" method="get">
        <div class="mb-3">
          <label for="question" class="form-label form-label-strong mb-3">Scenario Question</label>
          <textarea class="form-control form-field" id="question" name="question" rows="3" placeholder="Enter the scenario question. . ." required></textarea>
        </div>

        <div class="row g-3 g-md-4 align-items-end mb-2">
          <div class="col"><span class="form-label-strong">Answer Options</span></div>
          <div class="col-3 col-md-2"><span class="form-label-strong">Score</span></div>
        </div>

        <div class="row g-3 g-md-4 mb-3">
          <div class="col">
            <label for="answerA" class="visually-hidden">Answer A</label>
            <input type="text" class="form-control form-field" id="answerA" name="answerA" placeholder="Answer A. . ." required>
          </div>
          <div class="col-3 col-md-2">
            <label for="scoreA" class="visually-hidden">Score for answer A</label>
            <select class="form-select form-control form-field score-input" id="scoreA" name="scoreA">
              <option selected>0</option><option>1</option><option>3</option>
            </select>
          </div>
        </div>
        <div class="row g-3 g-md-4 mb-3">
          <div class="col">
            <label for="answerB" class="visually-hidden">Answer B</label>
            <input type="text" class="form-control form-field" id="answerB" name="answerB" placeholder="Answer B. . ." required>
          </div>
          <div class="col-3 col-md-2">
            <label for="scoreB" class="visually-hidden">Score for answer B</label>
            <select class="form-select form-control form-field score-input" id="scoreB" name="scoreB">
              <option>0</option><option selected>1</option><option>3</option>
            </select>
          </div>
        </div>
        <div class="row g-3 g-md-4 mb-5">
          <div class="col">
            <label for="answerC" class="visually-hidden">Answer C</label>
            <input type="text" class="form-control form-field" id="answerC" name="answerC" placeholder="Answer C. . ." required>
          </div>
          <div class="col-3 col-md-2">
            <label for="scoreC" class="visually-hidden">Score for answer C</label>
            <select class="form-select form-control form-field score-input" id="scoreC" name="scoreC">
              <option>0</option><option>1</option><option selected>3</option>
            </select>
          </div>
        </div>

        <div class="d-flex flex-column flex-sm-row justify-content-center align-items-center gap-4 pb-2">
          <button type="submit" class="btn btn-primary btn-form">Save Scenario</button>
          <a href="admin-scenarios.html" class="btn btn-outline-primary btn-form">Cancel</a>
        </div>
      </form>
    </div>
  </main>
{% endblock %}
