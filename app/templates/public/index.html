{% extends "template.html" %}

{% block content %}
{% include "partials/navbar_public.html" %}
  <main class="container text-center py-5">
    <div class="mx-auto pt-lg-5">
      <h1 class="display-hero mt-lg-5 mb-4">Are you sharing too much with AI?</h1>
      <p class="fs-20 fw-semibold text-secondary-ink mb-5">Test your knowledge of responsible AI use.</p>

      <div class="panel w-content-sm mx-auto mb-5">
        <div class="d-flex justify-content-between align-items-center px-5 overridecsp-height90">
          <span class="fs-18 fw-medium">10 Questions</span>
          <span class="fs-18 fw-medium">Anonymous</span>

      <a href="{{ url_for('public.quiz') }}" class="btn btn-primary btn-cta mt-3">Start Quiz</a>
