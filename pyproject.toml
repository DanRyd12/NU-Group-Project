[project]
name = "nu-group-project"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "flask>=3.1,<3.2",
    "sqlalchemy>=2.0,<2.1",
    "flask-wtf>=1.2,<1.3",
    "wtforms>=3.2,<3.3",
    "flask-login>=0.6,<0.7",
    "argon2-cffi>=25,<26",
    "tldextract>=5,<6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "pytest-cov>=6,<7",
    "bandit>=1.8,<1.9",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
